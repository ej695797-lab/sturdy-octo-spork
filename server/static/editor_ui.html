<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yeeps Editor</title>
<style>
  :root { color-scheme: dark; --accent: #8b5cf6; --accent-hover: #a78bfa; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: #111; color: #ddd; font-size: 14px; }
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  aside { order: 1; flex-shrink: 0; background: #181818; border-top: 1px solid #333;
          padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
          position: sticky; bottom: 0; z-index: 10; }
  aside button { background: #222; color: #ccc; border: 1px solid #333; padding: 9px 12px;
                 border-radius: 6px; cursor: pointer; text-align: center; }
  aside button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  aside a { color: var(--accent-hover); text-decoration: none; font-size: 13px; align-self: center; padding: 0 6px; }
  .sp { display: none; }
  main { order: 0; flex: 1; padding: 16px; width: 100%; max-width: 1032px; margin: 0 auto; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  input[type=text] { background: #0c0c0c; border: 1px solid #333; color: #ddd;
                     padding: 7px 10px; border-radius: 6px; min-width: 220px; }
  textarea { width: 100%; height: 55vh; background: #0c0c0c; border: 1px solid #333; color: #ddd;
             font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
             padding: 10px; border-radius: 6px; }
  button.go { background: var(--accent); color: #fff; border: 0; padding: 8px 18px; border-radius: 6px;
              cursor: pointer; font-size: 14px; }
  button.del { background: #a33; color: #fff; border: 0; padding: 5px 10px; border-radius: 6px;
               cursor: pointer; }
  button.blk { background: #964b00; color: #fff; border: 0; padding: 8px 14px; border-radius: 6px;
               cursor: pointer; font-size: 14px; }
  ul.list { list-style: none; margin: 0 0 10px; padding: 0; max-height: 220px; overflow: auto;
            border: 1px solid #333; border-radius: 6px; }
  ul.list li { padding: 7px 10px; border-bottom: 1px solid #222; cursor: pointer; }
  ul.list li:hover { background: #1c1c1c; }
  ul.list li.bli { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: default; }
  ul.list li.bli:hover { background: transparent; }
  li.bli .binfo { min-width: 0; flex: 1 1 auto; }
  li.bli .bname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li.bli .bmeta { color: #888; font-size: 11px; margin-top: 2px; word-break: break-word; }
  li.bli .kperm { color: #e66; } li.bli .ktimed { color: #ec9; } li.bli .kshadow { color: #d7bde2; }
  li.bli button { flex: 0 0 auto; }
  #blist { max-height: 62vh; }
  .muted { color: #888; }
  .note { color: #888; margin: 0 0 10px; }
  #msg { position: fixed; top: 16px; left: 16px; background: #222; border: 1px solid #444;
         padding: 10px 14px; border-radius: 6px; display: none; max-width: 60vw; }
  table { border-collapse: collapse; font-size: 12px; }
  td, th { border: 1px solid #333; padding: 3px 7px; text-align: left; }
  details { margin-bottom: 8px; border: 1px solid #333; border-radius: 6px; overflow: hidden; }
  summary { padding: 7px 10px; background: #1c1c1c; cursor: pointer; font-weight: 600; }
  details ul.list { border: 0; border-top: 1px solid #333; border-radius: 0; max-height: 300px; }
  .has { color: var(--accent-hover); }
  table.errs { width: 100%; }
  table.errs td.msg { font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-word; cursor: pointer; }
  table.errs tr:hover td { background: #1a1a1a; }
  .up { color: #e66; } .down { color: var(--accent-hover); }
  .pgrp { margin: 0 0 10px; }
  .pgrp .muted { display: block; margin-bottom: 5px; font-size: 12px; }
  .pgrp button { background: #222; color: #ddd; border: 1px solid #9b59b6; padding: 7px 11px;
                 border-radius: 6px; cursor: pointer; margin: 0 6px 6px 0; }
  .pgrp button:hover { border-color: var(--accent); }
  .pgrp button.off { color: #e99; }
  #pblog { height: 40vh; overflow: auto; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 60px; margin: 8px 0 12px; }
  .bars div { flex: 1; background: var(--accent); min-height: 1px; }
  pre.smp { background: #0c0c0c; border: 1px solid #333; padding: 8px; border-radius: 6px;
            white-space: pre-wrap; word-break: break-word; font-size: 12px; margin: 4px 0 10px; }
  select { background: #0c0c0c; border: 1px solid #333; color: #ddd; padding: 6px 8px; border-radius: 6px; }
  input[type=number] { background: #0c0c0c; border: 1px solid #333; color: #ddd; padding: 6px 8px; border-radius: 6px; width: 90px; }
  .pwhit { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; cursor: default !important; }
  .pwhit .pwname { flex: 1 1 200px; min-width: 0; }
  .pwhit button { background: #222; color: #ddd; border: 1px solid #444; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  .pwhit button:hover { border-color: var(--accent); }
  .app.bot-open main { max-width: 1600px; }
  .bot-layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(320px, .7fr); gap: 16px; align-items: start; }
  .bot-controls { min-width: 0; }
  .bot-map-panel { min-width: 0; position: sticky; top: 12px; background: #151515; border: 1px solid #333; border-radius: 8px; padding: 10px; }
  .bot-map-panel h3 { margin: 0 0 4px; font-size: 15px; }
  .bot-map-panel .muted { display: block; min-height: 18px; font-size: 12px; margin-bottom: 8px; }
  #bot-map { display: block; width: 100%; height: min(72vh, 760px); min-height: 360px; background: #0c0c0c; border: 1px solid #292929; border-radius: 6px; }

  /* Phones keep the tab controls in a scrolling strip at the bottom. */
  @media (max-width: 720px) {
    body { font-size: 15px; }
    aside { flex-wrap: nowrap; justify-content: flex-start; align-items: center; overflow-x: auto;
            border-top: 1px solid #333; padding: 8px; gap: 6px;
            -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    aside::-webkit-scrollbar { display: none; }
    aside button { flex: 0 0 auto; white-space: nowrap; padding: 9px 13px; }
    aside #ver, aside #who { display: none; }
    aside a { white-space: nowrap; flex: 0 0 auto; padding: 0 6px; }
    main { padding: 12px; max-width: 100%; min-width: 0; }
    .row { gap: 8px; }
    .row > input[type=text], .row > select { flex: 1 1 100%; }
    .row label { flex: 1 1 140px; }
    input[type=text], input[type=number], input[type=password], select, textarea { font-size: 16px; }
    main input[type=text], main select, main input[type=number] { min-width: 0 !important; max-width: 100%; }
    .row label input[type=text], .row label select { width: 100%; }
    textarea { height: 45vh; }
    button.go, button.blk, button.del { min-height: 40px; }
    ul.list li { padding: 11px 10px; }
    ul.list { max-height: 50vh; }
    li.bli { flex-wrap: wrap; }
    .bot-layout { grid-template-columns: minmax(0, 1fr); }
    .bot-map-panel { position: static; }
    #bot-map { height: 55vh; min-height: 300px; }
    table { display: block; overflow-x: auto; max-width: 100%; }
    pre.smp, #pblog { font-size: 12px; }
    #msg { top: 12px; left: 12px; right: 12px; max-width: none; }
  }
  body.tier-editor .adminonly{display:none!important}
</style>
</head>
<body>
<div class="app">
  <main id="view"></main>
  <aside>
    <button data-t="players" class="on">Players</button>
    <button data-t="online">Online</button>
    <button data-t="bot">Bot</button>
<button data-t="photon">Photon</button>
    <button data-t="banned">Banned</button>
    <button data-t="default">Default</button>
    <button data-t="maps">Maps</button>
    <button data-t="disks">Disks</button>
    <button data-t="worlds">Worlds</button>
    <button data-t="news">News</button>
    <button data-t="announce">Announce</button>
    <button data-t="screens">Screens</button>
    <button data-t="errors">Errors</button>
    <button data-t="settings">Settings</button>
    <span class="sp"></span>
    <span class="muted" id="ver">Yeeps 1.31.0-yeeper</span>
    <span class="muted" id="who"></span>
    <a href="/editor/logout">Log out</a>
  </aside>
</div>
<div id="msg"></div>
<dialog id="moderation-dialog" style="border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--fg);max-width:400px;width:calc(100% - 32px)">
  <form method="dialog" id="moderation-form">
    <h3 style="margin-top:0">Confirm moderation password</h3>
    <p class="note">Enter the separate password configured as MODERATION_PASSWORD on the server.</p>
    <input id="moderation-password" type="password" autocomplete="current-password" required style="width:100%;box-sizing:border-box">
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button type="button" class="blk" id="moderation-cancel">Cancel</button>
      <button type="submit" class="del" value="authorize">Continue</button>
    </div>
  </form>
</dialog>

<script>
const API = "/editor/api";
const view = document.getElementById("view");

function toast(t, bad) {
  const m = document.getElementById("msg");
  m.textContent = t; m.style.borderColor = bad ? "#a33" : "var(--accent)"; m.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(() => m.style.display = "none", 3500);
}
async function api(path, opts) {
  const r = await fetch(API + path, opts || {});
  if (r.status === 401) { location.href = "/editor/login"; throw new Error("auth"); }
  const txt = await r.text();
  let j; try { j = txt ? JSON.parse(txt) : {}; } catch { j = { raw: txt }; }
  if (!r.ok) throw new Error(j.detail || j.error || ("HTTP " + r.status));
  return j;
}
function askModerationPassword() {
  const dialog = document.getElementById("moderation-dialog");
  const form = document.getElementById("moderation-form");
  const input = document.getElementById("moderation-password");
  input.value = "";
  return new Promise(resolve => {
    dialog.addEventListener("close", () => {
      const password = dialog.returnValue === "authorize" ? input.value : null;
      input.value = "";
      resolve(password);
    }, { once: true });
    form.onsubmit = event => {
      event.preventDefault();
      if (!input.value) return;
      dialog.close("authorize");
    };
    document.getElementById("moderation-cancel").onclick = () => dialog.close("cancel");
    dialog.showModal();
    input.focus();
  });
}
function pretty(o) { return JSON.stringify(o, null, 2); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
// Parse a ban length like "2h", "3d", "1w", "30m". "" = permanent (0). null = invalid.
function parseDur(s) {
  s = (s || "").trim().toLowerCase();
  if (!s) return 0;
  const m = s.match(/^(\d+(?:\.\d+)?)\s*(m|min|mins|h|hr|hrs|hour|hours|d|day|days|w|wk|week|weeks)?$/);
  if (!m) return null;
  const n = parseFloat(m[1]), u = (m[2] || "h")[0];
  return u === "m" ? n / 60 : u === "d" ? n * 24 : u === "w" ? n * 168 : n;
}

// ---- room categories (folders) ----
function roomCat(k) {
  k = (k || "").toLowerCase();
  if (k.startsWith("official") || k.startsWith("researchfacility")) return "Public";
  if (k.startsWith("ch2")) return "Chapter 2";
  if (k.startsWith("wild")) return "Wilds";
  if (k.startsWith("bam")) return "BAM";
  // Private worlds are keyed p_o_<accountID>(_sandbox); community worlds c_<name>.
  if (k.startsWith("p_o_") || k.startsWith("pw")) return "Private Worlds (pw)";
  if (k.startsWith("c_") || k.startsWith("cw")) return "Community Worlds (cw)";
  if (k.startsWith("halloween") || k.startsWith("bonus") || k.startsWith("xmas")) return "Seasonal / Bonus";
  return "Other";
}
const CAT_ORDER = ["Public", "Chapter 2", "Wilds", "BAM", "Community Worlds (cw)", "Private Worlds (pw)", "Seasonal / Bonus", "Other"];
function folders(rows, itemHtml) {
  const g = {};
  rows.forEach(r => { const c = roomCat(r.roomKey); (g[c] = g[c] || []).push(r); });
  const cats = CAT_ORDER.filter(c => g[c]).concat(Object.keys(g).filter(c => !CAT_ORDER.includes(c)));
  return cats.map(c =>
    `<details><summary>${c} (${g[c].length})</summary><ul class="list">${g[c].map(itemHtml).join("")}</ul></details>`
  ).join("");
}

// ---- Players / Rooms / Default share a raw-JSON editor ----
function renderJsonEditor(opts) {
  // opts: {search(q), load(id)->obj, save(id,obj), label}
  view.innerHTML = `
    ${opts.search ? `<div class="row"><input type="text" id="q" placeholder="${opts.hint || "search " + opts.label + "..."}"><button class="go" id="sbtn">Search</button></div><ul class="list" id="list"></ul>` : ""}
    <p class="note" id="sel"></p>
    <textarea id="ed" placeholder="select ${opts.label} above"></textarea>
    ${opts.devreset ? `<p class="note">Accounts are locked to the headset they play on. If a player gets "locked to another headset" (new or factory-reset headset, or new internet), select them and press <b>Reset headset lock</b>; their next login sets their headset.</p>` : ""}
    <div class="row" style="margin-top:10px"><button class="go" id="save">Save</button>${opts.kick ? ` <button class="blk" id="kickrow">Kick</button>` : ""}${opts.devreset ? ` <button class="blk adminonly" id="devrow">Reset headset lock</button>` : ""}${opts.block ? ` <button class="blk adminonly" id="blockrow">Block</button>` : ""}${opts.del ? ` <button class="del adminonly" id="delrow">Delete</button>` : ""}</div>`;
  const ed = document.getElementById("ed");
  const sel = document.getElementById("sel");
  let id = null, run = null, loaded = null;
  function updBlock() {
    const b = document.getElementById("blockrow");
    if (b) b.textContent = (loaded && (loaded.adminBlocked == 1 || loaded.adminBlocked === true)) ? "Unban" : "Ban";
  }
  async function open(theId) {
    id = theId;
    try { loaded = await opts.load(theId); ed.value = pretty(loaded); sel.textContent = theId ? ("Editing: " + theId) : "Editing default"; updBlock(); }
    catch (e) { toast(e.message, true); }
  }
  if (opts.search) {
    run = async () => {
      try {
        const rows = await opts.search(document.getElementById("q").value.trim());
        const ul = document.getElementById("list");
        ul.innerHTML = rows.map(r => `<li data-id="${opts.id(r)}">${opts.row(r)}</li>`).join("") || "<li class='muted'>no results</li>";
        ul.querySelectorAll("li[data-id]").forEach(li => li.onclick = () => open(li.dataset.id));
      } catch (e) { toast(e.message, true); }
    };
    document.getElementById("sbtn").onclick = run;
    document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
    run();
  } else { open(null); }
  document.getElementById("save").onclick = async () => {
    let obj; try { obj = JSON.parse(ed.value); } catch (e) { return toast("Invalid JSON: " + e.message, true); }
    const moderationFields = ["adminBlocked", "isPermabanned", "isMutebanned", "isIsolated",
      "shadowBanned", "banExpireTimestamp", "banReason", "blockReason", "banCategory"];
    const changesBanState = loaded && moderationFields.some(key =>
      Object.prototype.hasOwnProperty.call(obj, key) && JSON.stringify(obj[key]) !== JSON.stringify(loaded[key]));
    let moderationPassword;
    if (changesBanState) {
      moderationPassword = await askModerationPassword();
      if (moderationPassword === null) return;
    }
    try { await opts.save(id, obj, moderationPassword); toast("Saved."); } catch (e) { toast(e.message, true); }
  };
  const delBtn = document.getElementById("delrow");
  if (delBtn) delBtn.onclick = async () => {
    if (!id) return toast("Select one first", true);
    if (!confirm("Permanently delete " + id + "? This cannot be undone.")) return;
    const moderationPassword = await askModerationPassword();
    if (moderationPassword === null) return;
    try { await opts.del(id, moderationPassword); toast("Deleted " + id); id = null; ed.value = ""; sel.textContent = ""; if (run) run(); }
    catch (e) { toast(e.message, true); }
  };
  const kickBtn = document.getElementById("kickrow");
  if (kickBtn) kickBtn.onclick = async () => {
    if (!id) return toast("Select a player first", true);
    const reason = prompt("Kick " + ((loaded && loaded.displayName) || id) + "? Optional reason (shown to them):", "");
    if (reason === null) return;
    const moderationPassword = await askModerationPassword();
    if (moderationPassword === null) return;
    try { await opts.kick(id, reason.trim(), moderationPassword); toast("Kicked - lands within about a minute"); }
    catch (e) { toast(e.message, true); }
  };
  const devBtn = document.getElementById("devrow");
  if (devBtn) devBtn.onclick = async () => {
    if (!id) return toast("Select a player first", true);
    if (!confirm("Reset the headset lock for " + ((loaded && loaded.displayName) || id) + "? Their next login (from any headset) becomes their headset.")) return;
    try { await opts.devreset(id); toast("Headset lock reset - their next login sets the new headset"); }
    catch (e) { toast(e.message, true); }
  };
  const blockBtn = document.getElementById("blockrow");
  if (blockBtn) blockBtn.onclick = async () => {
    if (!id) return toast("Select a player first", true);
    const isBlocked = loaded && (loaded.adminBlocked == 1 || loaded.adminBlocked === true);
    if (isBlocked) {
      const moderationPassword = await askModerationPassword();
      if (moderationPassword === null) return;
      try {
        await opts.block(id, false, moderationPassword);
        toast("Unbanned — can connect");
        await open(id);
      } catch (e) { toast(e.message, true); }
      return;
    }
    try {
      const raw = prompt("Ban length — e.g. 2h, 3d, 7d, 1w — or leave blank for permanent:", "");
      if (raw === null) return;
      const hours = parseDur(raw);
      if (hours === null) return toast("Bad length — use e.g. 2h, 3d, 7d, or blank for permanent", true);
      const moderationPassword = await askModerationPassword();
      if (moderationPassword === null) return;
      const r = await opts.block(id, true, moderationPassword, hours);
      toast("Banned " + (r && r.until ? "until " + r.until : "(permanent)"));
      await open(id);
    } catch (e) { toast(e.message, true); }
  };
}

const tabs = {
  players: () => renderJsonEditor({
    label: "players", hint: "search name, Discord username, Discord ID or account ID...",
    search: q => api("/players?limit=100&q=" + encodeURIComponent(q)),
    id: r => r.accountID, row: r => `${r.displayName || "(no name)"} <span class="muted">${r.accountID}${r.discordUsername ? " · Discord: " + esc(r.discordUsername) : ""} · ${r.currency ?? "?"}c ${r.beans ?? "?"}b</span>`,
    load: id => api("/player/" + encodeURIComponent(id)),
    save: (id, o, moderationPassword) => {
      if (moderationPassword) o.moderationPassword = moderationPassword;
      return api("/player/" + encodeURIComponent(id), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(o) });
    },
    del: (id, moderationPassword) => api("/player/" + encodeURIComponent(id), { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ moderationPassword }) }),
    kick: (id, reason, moderationPassword) => api("/player/" + encodeURIComponent(id) + "/kick", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reason, moderationPassword }) }),
    devreset: id => api("/player/" + encodeURIComponent(id) + "/device-reset", { method: "POST" }),
    block: (id, blocked, moderationPassword, hours) => {
      const headers = { "Content-Type": "application/json" };
      if (!blocked) return api("/player/" + encodeURIComponent(id) + "/unban", { method: "POST", headers, body: JSON.stringify({ moderationPassword }) });
      return api("/player/" + encodeURIComponent(id) + "/ban", { method: "POST", headers, body: JSON.stringify({ durationHours: hours, moderationPassword }) });
    },
  }),
  banned: async () => {
    view.innerHTML = `<p class="note">Players that are currently banned. Click <b>Unban</b> to lift the account and headset bans.</p>
      <div class="row"><button class="go" id="refb">Refresh</button> <span class="muted" id="bcount"></span></div>
      <ul class="list" id="blist"><li>loading...</li></ul>`;
    async function load() {
      const list = document.getElementById("blist");
      list.innerHTML = "<li>loading...</li>";
      let d; try { d = await api("/banned"); } catch (e) { list.innerHTML = `<li>Error: ${esc(e.message)}</li>`; return; }
      document.getElementById("bcount").textContent = d.count + " banned";
      if (!d.banned || !d.banned.length) { list.innerHTML = "<li>No one is banned.</li>"; return; }
      const kcls = { permanent: "kperm", timed: "ktimed", shadowban: "kshadow" };
      list.innerHTML = d.banned.map(b =>
        `<li class="bli"><div class="binfo">` +
          `<div class="bname">${esc(b.name)}</div>` +
          `<div class="bmeta"><span class="${kcls[b.kind] || ""}">${esc(b.kind)}</span>` +
          `${b.expires ? " until " + esc(b.expires) : ""} · ${esc(b.accountID)}` +
          `${b.reason ? " · " + esc(b.reason) : ""}</div>` +
        `</div><button class="go" data-unban="${esc(b.accountID)}">Unban</button></li>`
      ).join("");
      list.querySelectorAll("button[data-unban]").forEach(btn => btn.onclick = async () => {
        if (!confirm("Unban " + btn.dataset.unban + "?")) return;
        const moderationPassword = await askModerationPassword();
        if (moderationPassword === null) return;
        try {
          await api("/player/" + encodeURIComponent(btn.dataset.unban) + "/unban", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ moderationPassword })
          });
          toast("Unbanned " + btn.dataset.unban); load();
        } catch (e) { toast(e.message, true); }
      });
    }
    document.getElementById("refb").onclick = load;
    load();
  },
  default: () => { view.innerHTML = `<p class="note">This is what EVERY new player starts with (owned items, roles, currency...).</p>`;
    const holder = document.createElement("div"); view.appendChild(holder);
    renderJsonEditor({ label: "default", search: null,
      load: () => api("/default"),
      save: (_id, o) => api("/default", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(o) }) });
  },
  maps: async () => {
    view.innerHTML = `<p class="note">Maps in folders. Purple = has a saved map. Click a map, then open a section to edit it: <b>Settings</b> (theme/biome, size, floor, liquid, lighting, flags), <b>Blocks</b>, or <b>Danger zone</b>.</p>
      <div class="row"><input type="text" id="pwq" placeholder="find a private world: Meta name, Discord, or player ID">

  worlds: async () => { /* EXTRAS-PATCH-v1 */

  disks: async () => {
    view.innerHTML = `<p class="note">Your own music on the game's record disks, for everyone, with no new APK. Pick a record, pick an audio file (mp3, ogg, wav, ...), Upload. Players hear it the next time they start the game. Files are converted to mono WAV in your browser (OGG files are sent as they are); about 4 minutes fit.</p>
      <div class="row" style="align-items:center"><select id="drec" style="min-width:240px"></select>
        <input type="file" accept="audio/*,.ogg,.mp3,.wav,.m4a,.flac" id="dfile">
        <button class="go" id="dgo">Upload</button> <span class="muted" id="dmsg"></span></div>
      <h3 style="margin-top:18px">Records with your music</h3><ul class="list" id="dlist"><li class="muted">loading...</li></ul>`;
    const sel = document.getElementById("drec");
    let recs = [];
    try { const d = await api("/default"); recs = ((d.value || d).ownedPatterns || []).filter(k => k.startsWith("record_")).sort(); } catch (_) {}
    if (!recs.length) recs = ["record_suburbTheme", "record_snowTheme", "record_oceanTheme", "record_fantasyTheme"];
    sel.innerHTML = recs.map(r => `<option value="${esc(r)}">${esc(r.slice(7))}</option>`).join("");
    async function load() {
      const ul = document.getElementById("dlist");
      try {
        const d = (await api("/disks")).disks || [];
        ul.innerHTML = d.length ? "" : '<li class="muted">none yet</li>';
        d.forEach(x => {
          const li = document.createElement("li");
          li.innerHTML = `<b>${esc(x.clip)}</b> <span class="muted">${esc(x.ext)}, ${Math.round((x.size || 0) / 1024)} KB, by ${esc(x.by || "?")}</span> <button class="del">Remove</button>`;
          li.querySelector("button").onclick = async () => {
            if (!confirm("Put the original music back on " + x.clip + "?")) return;
            try { await api("/disks/" + encodeURIComponent(x.clip), { method: "DELETE" }); toast("Removed " + x.clip); load(); }
            catch (e) { toast(e.message, true); }
          };
          ul.appendChild(li);
        });
      } catch (e) { ul.innerHTML = `<li class="muted">${esc(e.message)}</li>`; }
    }
    function wav16(samples, rate) {            // mono Float32 -> 16-bit PCM WAV
      const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);
      const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
      w(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
      v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data");
      v.setUint32(40, samples.length * 2, true);
      for (let i = 0; i < samples.length; i++) { const x = Math.max(-1, Math.min(1, samples[i])); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true); }
      return new Blob([buf], { type: "audio/wav" });
    }
    document.getElementById("dgo").onclick = async () => {
      const f = document.getElementById("dfile").files[0], msg = document.getElementById("dmsg");
      if (!f) return toast("Pick an audio file first", true);
      let body = f, ext = "ogg";
      try {
        if (!/\.ogg$/i.test(f.name)) {
          msg.textContent = "converting...";
          const rate = 22050, ac = new AudioContext();
          const src = await ac.decodeAudioData(await f.arrayBuffer()); ac.close();
          const off = new OfflineAudioContext(1, Math.ceil(src.duration * rate), rate);
          const node = off.createBufferSource(); node.buffer = src; node.connect(off.destination); node.start();
          body = wav16((await off.startRendering()).getChannelData(0), rate); ext = "wav";
        }
        if (body.size > 11.5 * 1024 * 1024) { msg.textContent = ""; return toast("Too long (over ~4 minutes). Trim it, or upload an .ogg.", true); }
        msg.textContent = "uploading...";
        const r = await api("/disks/" + encodeURIComponent(document.getElementById("drec").value) + "?ext=" + ext,
                            { method: "POST", body });
        msg.textContent = ""; toast("Music set on " + r.clip + " (" + Math.round(r.bytes / 1024) + " KB)"); load();
      } catch (e) { msg.textContent = ""; toast(e.message, true); }
    };
    load();
  },

    async function loadVid() {

    // In-browser conversion: decode + shrink + compress here, upload only the
    // small result (the server's CPU is tiny and phone videos are huge).
    const VW = 256, VH = 144, VFPS = 10, VMAX = 120, VSEG = 60;
    let vidCancel = false, vidBusy = false;
    const vstat = t => { document.getElementById("vidprog").textContent = t; };
    async function zlibBytes(u8) {   // CompressionStream "deflate" = zlib format, what the APK's uncompress() reads
      return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream("deflate"))).arrayBuffer());
    }
    async function bscr(raw, n) {    // "BSCR" u16 w,h,n  u16 delay[n]  zlib(rgb24, bottom row first)
      const z = await zlibBytes(raw), out = new Uint8Array(10 + 2 * n + z.length), d = new DataView(out.buffer);
      out.set([66, 83, 67, 82]); d.setUint16(4, VW, true); d.setUint16(6, VH, true); d.setUint16(8, n, true);
      for (let i = 0; i < n; i++) d.setUint16(10 + 2 * i, Math.round(1000 / VFPS), true);

    function wav16(pcm, sr) {
      const n = pcm.length, b = new ArrayBuffer(44 + 2 * n), d = new DataView(b);
      const s = (o, t) => { for (let i = 0; i < t.length; i++) d.setUint8(o + i, t.charCodeAt(i)); };
      s(0, "RIFF"); d.setUint32(4, 36 + 2 * n, true); s(8, "WAVE"); s(12, "fmt "); d.setUint32(16, 16, true);
      d.setUint16(20, 1, true); d.setUint16(22, 1, true); d.setUint32(24, sr, true); d.setUint32(28, sr * 2, true);
      d.setUint16(32, 2, true); d.setUint16(34, 16, true); s(36, "data"); d.setUint32(40, 2 * n, true);
      for (let i = 0; i < n; i++) { const v = Math.max(-1, Math.min(1, pcm[i])); d.setInt16(44 + 2 * i, v < 0 ? v * 32768 : v * 32767, true); }

    async function browserConvert(file) {
      const url = URL.createObjectURL(file), v = document.createElement("video");
      v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
      v.style.cssText = "width:160px;height:90px;display:block;margin-top:6px;background:#000";
      document.getElementById("vidprev").replaceChildren(v);     // on screen so the browser doesn't throttle it
      try {
        await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error("browser can't read this file")); });
        const dur = Math.min(v.duration, VMAX);
        if (!isFinite(dur) || dur <= 0 || !v.videoWidth) throw new Error("couldn't read the video");
        const n = Math.max(1, Math.floor(dur * VFPS));
        const cv = document.createElement("canvas"); cv.width = VW; cv.height = VH;
        const g = cv.getContext("2d", { willReadFrequently: true });
        const k = Math.min(VW / v.videoWidth, VH / v.videoHeight), dw = v.videoWidth * k, dh = v.videoHeight * k;
        const segP = []; let seg = null, inSeg = 0, segCap = 0, got = 0;
        const grab = () => {           // current video frame -> next 1/FPS slot (letterboxed, bottom row first)
          g.fillStyle = "#000"; g.fillRect(0, 0, VW, VH); g.drawImage(v, (VW - dw) / 2, (VH - dh) / 2, dw, dh);
          const px = g.getImageData(0, 0, VW, VH).data;
          if (!seg) { segCap = Math.min(VSEG, n - got); seg = new Uint8Array(VW * VH * 3 * segCap); inSeg = 0; }
          let o = inSeg * VW * VH * 3;

          got++; inSeg++;
          if (inSeg === segCap) { segP.push(bscr(seg, inSeg)); seg = null; }
          if (got % 10 === 0 || got === n) vstat("Converting frames " + got + "/" + n);
        };
        if ("requestVideoFrameCallback" in v) {
          await new Promise((res, rej) => {    // play at 4x, grab each 1/FPS slot as it passes
            const cb = (_, meta) => {
              if (vidCancel) { v.pause(); return rej(new Error("cancelled")); }
              while (got < n && meta.mediaTime + 1e-3 >= got / VFPS) grab();
              if (got >= n) { v.pause(); return res(); }
              v.requestVideoFrameCallback(cb);
            };
            v.onended = () => { while (got < n) grab(); res(); };
            v.playbackRate = 4; v.requestVideoFrameCallback(cb); v.play().catch(rej);
          });
        } else {

            if (vidCancel) throw new Error("cancelled");
            await new Promise(r => { const t = setTimeout(r, 1500); v.onseeked = () => { clearTimeout(t); r(); }; v.currentTime = i / VFPS + 0.001; });
            grab();
          }
        }
        while (got < n) grab();
        const segs = await Promise.all(segP);
        let wav = null;
        try {
          vstat("Converting sound...");
          const ac = new (window.AudioContext || window.webkitAudioContext)();
          const buf = await ac.decodeAudioData(await file.arrayBuffer()); ac.close();
          const sr = 22050, off = new OfflineAudioContext(1, Math.ceil(Math.min(buf.duration, dur) * sr), sr);
          const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start(0);
          wav = wav16((await off.startRendering()).getChannelData(0), sr);
        } catch (e) { wav = null; }          // no sound track
        return { n, segs, wav };
      } finally { v.pause(); URL.revokeObjectURL(url); document.getElementById("vidprev").replaceChildren(); }
    }
    function packVideo(name, segs, n, wav, gen) {   // "BVID" u32 headerLen  header  segs...  wav

        segFrames: VSEG, segs: segs.map(s => s.length), audioFmt: wav ? "wav" : "", audioLen: wav ? wav.length : 0, loop: true, gen }));

        } catch (e) {

          r = await api("/video?loop=1&gen=" + gen + "&name=" + encodeURIComponent(f.name.slice(0, 80)),

      catch (e) { toast(e.message, true); }
    };
    load(); loadVid();
  },

        lastFrameTime = now;
        if (document.pointerLockElement === canvas) {
          const forward = (cameraKeys.has("KeyW") ? 1 : 0) - (cameraKeys.has("KeyS") ? 1 : 0);
          const side = (cameraKeys.has("KeyD") ? 1 : 0) - (cameraKeys.has("KeyA") ? 1 : 0);
          const vertical = (cameraKeys.has("Space") || cameraKeys.has("KeyE") ? 1 : 0) -
            (cameraKeys.has("ControlLeft") || cameraKeys.has("ControlRight") || cameraKeys.has("KeyQ") ? 1 : 0);
          const length = Math.hypot(forward, side, vertical) || 1;
          const speed = cameraKeys.has("ShiftLeft") || cameraKeys.has("ShiftRight") ? 24 : 6;
          cameraPosition[0] += (Math.sin(cameraYaw) * forward + Math.cos(cameraYaw) * side) * speed * dt / length;
          cameraPosition[2] += (Math.cos(cameraYaw) * forward - Math.sin(cameraYaw) * side) * speed * dt / length;
          cameraPosition[1] += vertical * speed * dt / length;
        }
        const rect = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
        const w = Math.max(1, Math.round(rect.width * dpr)), h = Math.max(1, Math.round(rect.height * dpr));
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
        gl.viewport(0, 0, w, h);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.useProgram(shaderProgram);
        const cp = Math.cos(cameraPitch), sp = Math.sin(cameraPitch), cy = Math.cos(cameraYaw), sy = Math.sin(cameraYaw);
        gl.uniform3fv(shaderProgram.camera, cameraPosition);
        gl.uniform3fv(shaderProgram.right, [cy, 0, -sy]);
        gl.uniform3fv(shaderProgram.up, [-sy * sp, cp, -cy * sp]);
        gl.uniform3fv(shaderProgram.forward, [sy * cp, sp, cy * cp]);
        gl.uniform1f(shaderProgram.aspect, w / h);
        gl.uniform1f(shaderProgram.focal, 1 / Math.tan(75 * Math.PI / 360));
        drawBuffer(gridBuffer, gridCount, gl.LINES);
        drawBuffer(positionBuffer, positionCount, gl.TRIANGLES);
        drawBuffer(playerBuffer, playerCount, gl.TRIANGLES);
        frameRequest = requestAnimationFrame(renderBotMap);
      }
      function cameraMouseMove(event) {
        if (document.pointerLockElement !== canvas) return;
        cameraYaw += event.movementX * 0.0025;
        cameraPitch = Math.max(-1.5, Math.min(1.5, cameraPitch - event.movementY * 0.0025));
      }
      const movementCodes = new Set(["KeyW", "KeyA", "KeyS", "KeyD", "KeyE", "KeyQ", "Space",
        "ControlLeft", "ControlRight", "ShiftLeft", "ShiftRight"]);
      function cameraKeyDown(event) {
        if (document.pointerLockElement !== canvas || !movementCodes.has(event.code)) return;
        cameraKeys.add(event.code); event.preventDefault();
      }
      function cameraKeyUp(event) { cameraKeys.delete(event.code); }
      function cameraLockChanged() { if (document.pointerLockElement !== canvas) cameraKeys.clear(); }
      function cameraClick() {
        if (!gl) return;
        canvas.focus();
        if (canvas.requestPointerLock) {
          const result = canvas.requestPointerLock();
          if (result && result.catch) result.catch(e => {
            $("bmapstate").textContent = "Could not capture mouse: " + e.message;
          });
        }
      }
      canvas.addEventListener("click", cameraClick);
      document.addEventListener("mousemove", cameraMouseMove);
      document.addEventListener("keydown", cameraKeyDown);
      document.addEventListener("keyup", cameraKeyUp);
      document.addEventListener("pointerlockchange", cameraLockChanged);
      $("bot-map-reset").onclick = resetBotCamera;
      window._botMapCleanup = () => {
        if (document.pointerLockElement === canvas) document.exitPointerLock();
        canvas.removeEventListener("click", cameraClick);
        document.removeEventListener("mousemove", cameraMouseMove);
        document.removeEventListener("keydown", cameraKeyDown);
        document.removeEventListener("keyup", cameraKeyUp);
        document.removeEventListener("pointerlockchange", cameraLockChanged);
        cancelAnimationFrame(frameRequest); cameraKeys.clear();
      };
      if (gl && shaderProgram) frameRequest = requestAnimationFrame(renderBotMap);
      async function loadBotMap() {
        const params = new URLSearchParams();
        if (mapData && mapData.sid) {
          params.set("sid", mapData.sid);
          params.set("rev", String(mapData.blocksRev));
        }
        try {
          const s = await api("/bot/map?" + params.toString());
          if (!s.available) {
            mapBlocks = [];
            mapData = { ...s, players: [], blocks: [] };
            cameraRoom = "";
            updateBlockGeometry(); updatePlayers();
          } else {
            if (s.blocks !== null) {
              mapBlocks = s.blocks || [];
              updateBlockGeometry();
            }
            const oldRoom = mapData && `${mapData.sid}:${mapData.room}`;
            mapData = { ...s, players: s.players || [], blocks: mapBlocks };
            const room = `${s.sid}:${s.room}`;
            if (room !== oldRoom) { cameraRoom = room; resetBotCamera(); }
            updatePlayers(); updateGrid();
          }
          const status = $("bmapstate");
          if (status) status.textContent = renderError ? "3D viewer unavailable: " + renderError
            : !s.available ? "Waiting for the bot to connect…"
            : `${esc(s.room || s.rk || "Room")} · ${mapBlocks.length.toLocaleString()} blocks · ${(s.players || []).length} players` +
              (s.loaded ? "" : " · map data loading");
        } catch (e) {
          const status = $("bmapstate");
          if (status) status.textContent = "Map unavailable: " + e.message;
        }
      }
    function renderActions(state) {
      $("bactions").innerHTML = GROUPS.map(([title, buttons]) =>
        `<div class="pgrp"><span class="muted">${esc(title)}</span>${buttons.map(([label, action, off, media, needsTarget]) =>
          `<button data-action="${esc(action)}" data-target="${needsTarget ? "1" : "0"}"${off ? ' class="off"' : ""}` +
          `${(media && !state.badAppleAvailable) || (action === "pixel-art" && !state.pixelArtAvailable) ||
            (action === "soundkey-play" && !state.soundKeyAvailable) ? " disabled" : ""}>${esc(label)}</button>`).join("")}</div>`
      ).join("");
      $("bactions").querySelectorAll("button[data-action]").forEach(b => b.onclick = () =>
        sendAction(b.dataset.action, b.dataset.target === "1"));
    }
    async function players() {
      for (const id of ["bhook", "btarget"]) {
        const select = $(id), previous = select.value;
        try {
          const d = await api("/online");
          const options = (d.players || []).map(p =>
            `<option value="${esc(p.accountID)}">${esc(p.displayName)}${p.roomKey ? " — " + esc(p.roomKey) : ""}</option>`).join("");
          select.innerHTML = `<option value="">${id === "bhook" ? "pick a player to follow" : "pick an online player"}</option>` + options;
          if (previous && [...select.options].some(o => o.value === previous)) select.value = previous;
        } catch (e) {
          select.innerHTML = `<option value="">error: ${esc(e.message)}</option>`;
        }
      }
    }
    async function refresh() {
      let s; try { s = await api("/bot"); } catch (e) { $("bstate").textContent = "Error: " + e.message; return; }
      const st = s.running ? "on" : (s.enabled ? "off" : "unavailable");
      const discordState = s.discordBot && s.discordBot.connected ? "connected"
        : (s.discordBot && s.discordBot.configured ? "configured, offline" : "not configured");
      $("bstate").innerHTML = `<b>${esc(st)}</b>` +
        (s.targetName ? ` · following <b>${esc(s.targetName)}</b>` : "") +
        (s.room ? ` · room <b>${esc(s.room)}</b>` : "") +
        ` · Discord profile bot ${esc(discordState)}` +
        (s.uptime ? ` · up ${s.uptime}s` : "") +
        (s.error ? ` · <span style="color:#f85149">${esc(s.error)}</span>` : "") +
        (!s.available ? ` · <span style="color:#f85149">${esc(s.reason || "")}</span>` : "");
      $("blog").textContent = (s.log || []).join("\n");
      $("blog").scrollTop = $("blog").scrollHeight;
      renderActions(s);
      $("bapplestatus").textContent = s.badAppleSize
        ? `Uploaded ${String(s.badAppleType || "MP3").toUpperCase()} (${(s.badAppleSize / 1024 / 1024).toFixed(1)} MB)`
        : (s.badAppleAvailable ? "Media available" : "No media uploaded");
      $("bpixelstatus").textContent = s.pixelArtSize
        ? `Uploaded image (${(s.pixelArtSize / 1024 / 1024).toFixed(1)} MB)`
        : (s.pixelArtAvailable ? "Image available" : "No image uploaded");
      $("bsoundkeystatus").textContent = s.soundKeySize
        ? `Uploaded ${String(s.soundKeyType || "audio").toUpperCase()} (${(s.soundKeySize / 1024 / 1024).toFixed(1)} MB)`
        : (s.soundKeyAvailable ? "Audio available" : "No audio uploaded");
    }
    async function sendAction(action, needsTarget) {
      const body = { action };
      if (needsTarget) {
        body.target = $("btarget").value;
        if (!body.target) { toast("Pick a player first", true); return; }
      }
      try {
        await api("/bot/action", { method: "POST", headers: { "Content-Type": "application/json" },
                                   body: JSON.stringify(body) });
        toast("Action sent");
      } catch (e) { toast(e.message, true); }
      setTimeout(refresh, 900);
    }
    $("bref").onclick = refresh;
    $("bappleupload").onclick = async () => {
      const file = $("bappleaudio").files[0];
      if (!file) { toast("Choose an MP3 or MP4 file first", true); return; }
      if (file.size > 12 * 1024 * 1024) { toast("Media file must be 12 MB or smaller", true); return; }
      try {
        const result = await api("/bot/media", { method: "POST",
          headers: { "Content-Type": file.type || (file.name.toLowerCase().endsWith(".mp4") ? "video/mp4" : "audio/mpeg") }, body: file });
        toast(result.restartRequired ? "Uploaded; stop and restart the bot to load it" : "Bad Apple media uploaded");
        refresh();
      } catch (e) { toast(e.message, true); }
    };
    $("bpixelupload").onclick = async () => {
      const file = $("bpixelimage").files[0];
      if (!file) { toast("Choose a PNG, JPEG, or WebP image first", true); return; }
      if (file.size > 8 * 1024 * 1024) { toast("Image must be 8 MB or smaller", true); return; }
      const contentType = file.type || ({
        png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp"
      }[file.name.split(".").pop().toLowerCase()] || "");
      if (!contentType) { toast("Upload a PNG, JPEG, or WebP image", true); return; }
      try {
        await api("/bot/pixel-art", { method: "POST", headers: { "Content-Type": contentType }, body: file });
        toast("Pixel-art image uploaded");
        refresh();
      } catch (e) { toast(e.message, true); }
    };
    $("bsoundkeyupload").onclick = async () => {
      const file = $("bsoundkeyaudio").files[0];
      if (!file) { toast("Choose an audio file first", true); return; }
      if (file.size > 12 * 1024 * 1024) { toast("Audio must be 12 MB or smaller", true); return; }
      const contentType = file.type || ({
        mp3: "audio/mpeg", wav: "audio/wav", ogg: "audio/ogg", m4a: "audio/mp4"
      }[file.name.split(".").pop().toLowerCase()] || "");
      if (!contentType) { toast("Upload an MP3, WAV, OGG, or M4A audio file", true); return; }
      try {
        const result = await api("/bot/soundkey", { method: "POST", headers: { "Content-Type": contentType }, body: file });
        toast(result.restartRequired ? "Uploaded; stop and restart the bot to load this audio type" : "SoundKey audio uploaded");
        refresh();
      } catch (e) { toast(e.message, true); }
    };
    $("bdlinkcode").onclick = async () => {
      const username = $("bdusername").value.trim();
      if (!username) { toast("Enter the exact Yeeps username", true); return; }
      $("bdcode").textContent = "Generating…";
      try {
        const result = await api("/bot/link-code", { method: "POST",
          headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username }) });
        $("bdcode").textContent = `${result.username}: ${result.code} (10 minutes)`;
        toast("Pairing code generated; share it privately");
      } catch (e) { $("bdcode").textContent = ""; toast(e.message, true); }
    };
    $("bstart").onclick = async () => {
      const target = $("bhook").value;
      if (!target) { toast("Pick a player to hook the bot to", true); return; }
      try {
        await api("/bot/start", { method: "POST", headers: { "Content-Type": "application/json" },
                                  body: JSON.stringify({ target }) });
        toast("Bot joining the player's room");
      } catch (e) { toast(e.message, true); }
      setTimeout(refresh, 900);
    };
    $("bstop").onclick = async () => {
      try { await api("/bot/stop", { method: "POST" }); toast("Bot stopped"); }
      catch (e) { toast(e.message, true); }
      refresh();
    };
    await players();
    await Promise.all([refresh(), loadBotMap()]);
    clearInterval(window._botTimer);
    window._botTimer = setInterval(refresh, 3000);
    clearInterval(window._botMapTimer);
    window._botMapTimer = setInterval(loadBotMap, 1000);
    clearInterval(window._botPlayersTimer);
    window._botPlayersTimer = setInterval(players, 10000);
  },
  photon: async () => {
    const GROUPS = [
      ["Powers", [["Rain", "rain"], ["Rain off", "rain off", 1], ["Clean up rain", "rain clean", 1],
                  ["Lightning hand", "lightning"], ["Freeze hand", "freeze"], ["Thaw everyone", "thaw", 1],
                  ["Boom", "boom"], ["Coin planet", "coins planet"], ["Coins off", "coins off", 1],
                  ["Smite picked player", "@smite"], ["Freeze picked player", "@ice"],
                  ["Meteor shower", "meteors"], ["Black hole", "blackhole"],
                  ["Mimic picked player", "@mimic"], ["Stop mimic", "stop", 1],
                  ["Who's here", "players"]]],
    ];
    view.innerHTML = `<p class="note">Hook the bot onto a player: it joins their room. Then run powers/effects. Stop the bot when done.</p>
      <div class="row"><b>Bot:</b> <span id="pbst" class="muted">checking...</span>
        <button class="del" id="pbstop">Stop bot</button></div>
      <div class="row">
        <select id="pbpl" style="min-width:260px"><option value="">loading players...</option></select>
        <label class="muted"><input type="checkbox" id="pbstay"> Stay in that room</label>
        <button class="go" id="pbhook">Hook on</button>
        <button class="blk" id="pbref">Refresh players</button>
      </div>
      ${GROUPS.map(([title, btns]) => `<div class="pgrp"><span class="muted">${esc(title)}</span>${
        btns.map(([label, cmd, off]) => `<button data-cmd="${esc(cmd)}"${off ? ' class="off"' : ""}>${esc(label)}</button>`).join("")}</div>`).join("")}
      <div class="row"><input type="text" id="pbcmd" placeholder="any bot command" style="flex:1">
        <button class="go" id="pbsend">Send</button></div>
      <pre class="smp" id="pblog"></pre>`;
    const $ = id => document.getElementById(id);
    async function players() {
      const sel = $("pbpl");
      try {
        const d = await api("/photon/players");
        const byRoom = {};
        d.players.forEach(p => (byRoom[p.roomName || p.roomKey || "?"] ||= []).push(p));
        sel.innerHTML = `<option value="">pick a player (${d.players.length} online)</option>` +
          Object.entries(byRoom).map(([room, ps]) => `<optgroup label="${esc(room)} (${ps.length})">${
            ps.map(p => `<option value="${esc(p.accountID)}">${esc(p.name)}</option>`).join("")}</optgroup>`).join("");
      } catch (e) { sel.innerHTML = `<option value="">error: ${esc(e.message)}</option>`; }
    }
    async function status() {
      if (!$("pblog")) { clearInterval(tabs.photon._t); return; }
      try {
        const s = await api("/photon/status");
        $("pbst").textContent = s.running
          ? `on - hooked to ${s.targetName || s.target || "?"}${s.stay ? " (staying in that room)" : " (following)"}`
          : "off";
        const box = $("pblog"), atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
        box.textContent = s.log || "(no output yet)";
        if (atEnd) box.scrollTop = box.scrollHeight;
      } catch (e) { $("pbst").textContent = "error: " + e.message; }
    }
    async function send(cmd) {
      try { const r = await api("/photon/cmd", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cmd }) });
            toast(r.reloading ? "Updating the bot first" : "Sent: " + cmd);
            setTimeout(status, 1200); }
      catch (e) { toast(e.message, true); }
    }
    function onPicked(word) {
      const target = $("pbpl").value;
      if (!target) { toast("Pick a player in the list first", true); return; }
      send(word + " " + target);
    }
    view.querySelectorAll("button[data-cmd]").forEach(b => b.onclick = () => {
      const c = b.dataset.cmd;
      if (c === "@mimic") {
        const target = $("pbpl").value;
        if (!target) { toast("Pick a player first", true); return; }
        api("/photon/mimic", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ target }) })
          .then(r => toast(r.moved ? "Bot going to room" : "Mimicking"))
          .catch(e => toast(e.message, true));
      } else if (c.startsWith("@")) onPicked(c.slice(1));
      else send(c);
    });
    $("pbsend").onclick = () => { const v = $("pbcmd").value.trim(); if (v) { send(v); $("pbcmd").value = ""; } };
    $("pbcmd").onkeydown = e => { if (e.key === "Enter") $("pbsend").click(); };
    $("pbref").onclick = players;
    $("pbhook").onclick = async () => {
      const target = $("pbpl").value;
      if (!target) { toast("Pick a player first", true); return; }
      $("pbhook").disabled = true;
      try { await api("/photon/start", { method: "POST", headers: { "Content-Type": "application/json" },
                                         body: JSON.stringify({ target, stay: $("pbstay").checked }) });
            toast("Bot hooked on"); }
      catch (e) { toast(e.message, true); }
      $("pbhook").disabled = false; status();
    };
    $("pbstop").onclick = async () => {
      $("pbstop").disabled = true;
      try { const r = await api("/photon/stop", { method: "POST" }); toast(r.was ? "Bot stopped" : "It wasn't running"); }
      catch (e) { toast(e.message, true); }
      $("pbstop").disabled = false; status();
    };
    clearInterval(tabs.photon._t);
    tabs.photon._t = setInterval(status, 3000);
    players(); status();
  },
};


document.querySelectorAll("aside button[data-t]").forEach(b => b.onclick = () => {
  clearInterval(window._botTimer);
  clearInterval(window._botPlayersTimer);
  clearInterval(window._botMapTimer);
  if (window._botMapCleanup) {
    window._botMapCleanup();
    window._botMapCleanup = null;
  }
  document.querySelector(".app").classList.remove("bot-open");
  document.querySelectorAll("aside button[data-t]").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); tabs[b.dataset.t]();
});

(async () => {
  try { const me = await api("/me");
        document.getElementById("who").textContent = "signed in as " + me.name;
        document.getElementById("ver").title = "database: " + (me.db || "?");
        // normal data editors (not "hi lol" admins): Players, Online, Announce only
        if (me.tier === "editor") {
          document.body.classList.add("tier-editor");
          const okTabs = new Set(["players", "online", "announce"]);
          document.querySelectorAll("[data-t]").forEach(b => { if (!okTabs.has(b.dataset.t)) b.style.display = "none"; });
          document.getElementById("who").textContent += " (data editor)";
        }
        }
  catch (e) { return; }
  tabs.players();
})();
</script>
